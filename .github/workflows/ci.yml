name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker compose up -d --build --wait --wait-timeout 60
      - run: docker compose exec -T app node tests/live-mcp.mjs
      - run: docker compose exec -T -e MCP_TRANSPORT=stdio app node tests/live-mcp.mjs
      - name: Application logs on failure
        if: failure()
        run: docker compose logs --tail 100 app
      - name: Stop temporary installation
        if: always()
        run: docker compose down -v
