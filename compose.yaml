services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-17882}:17882"
    environment:
      PRIVATE_DIR: /data
      HOST: 0.0.0.0
      PORT: 17882
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      TEX_IMAGE: paper-studio-mcp-tex:local
    volumes:
      - studio-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      tex-image:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17882/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
  tex-image:
    image: paper-studio-mcp-tex:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.tex
    entrypoint: ["/bin/true"]
volumes:
  studio-data:
